name: Bug Report
description: Report a reproducible problem in PromptProfit
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include any source code, file paths, prompt text, or other workspace content from a project where you were using PromptProfit — only information about PromptProfit itself.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - API (apps/api)
        - VS Code extension (apps/extension)
        - Web dashboard (apps/web)
        - Database / migrations (packages/database)
        - Ledger (packages/ledger)
        - Fraud scoring (packages/fraud)
        - Telemetry (packages/telemetry)
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Extension version, package version, or commit SHA you're running.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Node version:
        - VS Code version (if extension-related):
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any error output. Redact anything sensitive.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: privacy-confirm
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included any source code, file paths, prompts, AI responses, or other project content from my own codebase in this report.
          required: true
